name: Release

# Triggered by pushing a version tag (v*) or by manual dispatch.
# Builds and packages the release artifacts, verifies the checksums,
# attaches them to the GitHub Release for the tag, and submits the
# Chrome build to the Chrome Web Store as a staged publish.
# On tag pushes it also regenerates CHANGELOG.md and commits it back
# to master.
# The staged publish goes live only when you publish it in the
# Developer Dashboard after review passes.
# Firefox signing and the store listing remain manual.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the GitHub Release to create or update (for example v0.3.0)
        required: true
        default: v0.3.0
      dry_run:
        description: Check the Chrome Web Store credentials without uploading
        type: boolean
        required: true
        default: false
      publish_release:
        description: Attach the artifacts to the GitHub Release for the tag
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tag and version
        id: meta
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Storybook tests
        run: npm run test:stories

      - name: Assert version matches package.json
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json version $PKG_VERSION does not match the tag $VERSION" >&2
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Package
        run: npm run package

      - name: Verify checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: metromark-${{ steps.meta.outputs.version }}
          path: |
            release/*.zip
            release/*.xpi
            release/SHA256SUMS.txt
            release/INSTALL.md
            release/PRIVACY.md
            release/NOTICE.md
          retention-days: 30

  release:
    needs: build
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: metromark-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Build release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          node_modules/.bin/git-cliff --config cliff.toml --latest --strip all > release-notes.md
          printf '\nFirefox XPI is unsigned; permanent standard Firefox installs need Mozilla signing. The Chrome build is submitted as a staged publish; publish it in the Developer Dashboard after review passes. See docs/INSTALL.md, PRIVACY.md and NOTICE.md in the repository.\n' >> release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" artifacts/* --title "MetroMark $VERSION" --notes-file release-notes.md
          fi

  changelog:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate CHANGELOG.md
        run: node_modules/.bin/git-cliff --config cliff.toml --output CHANGELOG.md

      - name: Commit and push if changed
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): v$VERSION [skip ci]"
          git push origin master

  publish-chrome:
    needs: build
    runs-on: ubuntu-latest
    # The chrome-web-store environment holds the store API secrets and
    # requires a reviewer. Create it in the repository settings first.
    # See the release section of README.md.
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: metromark-${{ needs.build.outputs.version }}
          path: artifacts

      - name: Submit the Chrome build to the Chrome Web Store
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          # Submit the exact ZIP that SHA256SUMS.txt covers.
          # Flags use the equals form: the service account private key
          # spans multiple lines and starts with dashes, which breaks
          # space-separated parsing (the CLI prints help and exits 0).
          CHROME_ZIP="artifacts/metromark-chrome-$VERSION.zip"
          test -f "$CHROME_ZIP"
          args=(--chrome-api-version=v2
                --chrome-zip="$CHROME_ZIP"
                --chrome-extension-id="$CHROME_EXTENSION_ID"
                --chrome-publisher-id="$CHROME_PUBLISHER_ID"
                --chrome-service-account-client-email="$CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL"
                --chrome-service-account-private-key="$CHROME_SERVICE_ACCOUNT_PRIVATE_KEY"
                --chrome-publish-type=STAGED_PUBLISH)
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          npx wxt submit "${args[@]}"
